<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Prescription Manager</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="style.css">

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="app.js" defer></script>
</head>
<body class="flex items-center justify-center">

    <div id="auth-container" class="auth-card max-w-md w-full">
        <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">Prescription Manager</h2>
        <div class="flex justify-center mb-4 rounded-lg shadow-inner-custom p-1">
            <button id="login-tab" class="tab-btn flex-1 px-4 py-2 font-semibold rounded-lg">Login</button>
            <button id="signup-tab" class="tab-btn flex-1 px-4 py-2 font-semibold rounded-lg">Signup</button>
        </div>
        <form id="login-form" class="auth-form flex flex-col gap-4">
            <input type="email" id="login-email" placeholder="Email" required class="input-field">
            <input type="password" id="login-password" placeholder="Password" required class="input-field">
            <button type="submit" class="btn btn-indigo">Login</button>
            <p id="login-error" class="error-message"></p>
        </form>
        <form id="signup-form" class="auth-form hidden flex flex-col gap-4">
            <input type="text" id="signup-name" placeholder="Full Name" required class="input-field">
            <input type="email" id="signup-email" placeholder="Email" required class="input-field">
            <input type="password" id="signup-password" placeholder="Password" required class="input-field">
            <button type="submit" class="btn btn-indigo">Signup</button>
            <p id="signup-error" class="error-message"></p>
        </form>
    </div>

    <div id="dashboard" class="hidden w-full max-w-7xl mx-auto p-4 md:p-6">
        <header class="flex justify-between items-center mb-6 pb-4 border-b border-gray-200">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">My Prescriptions</h1>
                <p id="welcome-message" class="text-gray-600">Welcome back!</p>
            </div>
            <div>
                <button id="add-prescription-btn" class="btn btn-indigo mr-2">Add New Prescription</button>
                <button id="logout-btn" class="btn btn-danger">Logout</button>
            </div>
        </header>
        
        <div id="loader" class="text-center py-10">
             <div class="spinner-border text-indigo-600" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div id="prescriptions-list" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
            </div>
         <p id="no-prescriptions-message" class="hidden text-center text-gray-500 py-10">You have no prescriptions yet. Click "Add New Prescription" to get started.</p>
    </div>

    <div class="modal fade" id="prescription-modal" tabindex="-1" aria-labelledby="modal-title" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-custom">
                <div class="modal-header">
                    <h5 class="modal-title text-xl font-semibold" id="modal-title">Add Prescription</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="prescription-form" class="flex flex-col gap-4">
                        <input type="hidden" id="prescription-id"> <input type="text" id="medicine-name" placeholder="Medicine Name" class="input-field" required>
                        <input type="text" id="dosage" placeholder="Dosage (e.g., 500mg)" class="input-field" required>
                        <input type="text" id="frequency" placeholder="Frequency (e.g., Twice a day)" class="input-field" required>
                        <input type="text" id="doctor-name" placeholder="Doctor's Name" class="input-field" required>
                        <input type="date" id="prescription-date" class="input-field" required>
                        <textarea id="notes" placeholder="Notes (optional)" class="input-field"></textarea>
                        <p id="prescription-error" class="error-message"></p>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" form="prescription-form" id="save-prescription-btn" class="btn btn-indigo">Save Prescription</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
